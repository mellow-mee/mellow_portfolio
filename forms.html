<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form action="" method="get">
        
        <label for="email_input">
            email
        </label>
        <input type="email" name="email" id="email_input" placeholder="your@email.com">
    
        <br>
        <p>Choose character</p>
        <input type="radio" name="option" value="Harry" id="option 1">
        <label for="option 1">Harry</label>
        <input type="radio" name="option" value="Cedric" id="option 2">
        <label for="option 2">Cedric</label>
        <input type="radio" name="option" value="Draco" id="option 3">
        <label for="option 3">Draco</label>
        
        <br>
        <button type="submit">Login</button>
    </form>
</body>
</html>
